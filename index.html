<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhun</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app" id="app">

    <!-- ========== HOME VIEW ========== -->
    <section class="view active" id="home-view">

      <header class="brand">
        <svg class="logo" viewBox="0 0 48 48" aria-label="SurWave logo">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1ed760"/>
              <stop offset="1" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <circle cx="24" cy="24" r="24" fill="url(#logoGrad)"/>
          <rect x="12" y="20" width="4" height="8" rx="2" fill="#fff"/>
          <rect x="19" y="14" width="4" height="20" rx="2" fill="#fff"/>
          <rect x="26" y="10" width="4" height="28" rx="2" fill="#fff"/>
          <rect x="33" y="18" width="4" height="12" rx="2" fill="#fff"/>
        </svg>
        <span class="brand-name">Dhun</span>
      </header>

      <div class="home-header">
        <h1>Good Vibes</h1>
        <p>Your music, your mood</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-all">All Songs</button>
        <button class="tab" id="tab-fav"><i class="fa-solid fa-heart"></i> Favourites</button>
      </div>

      <ul class="song-list" id="song-list"></ul>
      <p class="empty-msg" id="empty-msg">No favourite songs yet. Tap the heart on any song.</p>

      <!-- Mini player -->
      <div class="mini-player" id="mini-player">
        <img id="mini-cover" src="" alt="">
        <div class="mini-info">
          <h4 id="mini-title">Song Title</h4>
          <p id="mini-artist">Artist</p>
        </div>
        <button id="mini-play"><i class="fa-solid fa-play"></i></button>
      </div>

    </section>

    <!-- ========== PLAYER VIEW ========== -->
    <section class="view" id="player-view">

      <div class="top-bar">
        <button id="back-btn" title="Back"><i class="fa-solid fa-chevron-down"></i></button>
        <span>Now Playing</span>
        <span class="spacer"></span>
      </div>

      <div class="player-layout">

        <div class="player-main">

          <div class="cover" id="cover-box">
            <img id="cover" src="" alt="Album cover">
          </div>

          <div class="title-row">
            <div class="info">
              <h2 id="title">Song Title</h2>
              <p id="artist">Artist Name</p>
            </div>
            <button class="fav-btn" id="fav-btn" title="Favourite"><i class="fa-regular fa-heart"></i></button>
          </div>

          <div class="progress-area">
            <input type="range" id="progress" min="0" max="100" value="0">
            <div class="time">
              <span id="current-time">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="controls">
            <button id="shuffle" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
            <button id="prev" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play" class="play-btn" title="Play"><i class="fa-solid fa-play"></i></button>
            <button id="next" title="Next"><i class="fa-solid fa-forward-step"></i></button>
            <button id="repeat" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
          </div>

          <div class="volume">
            <i class="fa-solid fa-volume-low"></i>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
            <i class="fa-solid fa-volume-high"></i>
          </div>

        </div>

        <div class="player-side">
          <h3 class="up-next-title">Up Next</h3>
          <ul class="song-list" id="up-next"></ul>
        </div>

      </div>

    </section>

  </div>

  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
